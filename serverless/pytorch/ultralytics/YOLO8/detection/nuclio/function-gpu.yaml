metadata:
  name: yolov8-plate-detection
  namespace: cvat
  annotations:
    name: YOLOv8 plate Detection
    type: detector
    framework: pytorch
    spec: |
      [
        { "id": 1, "name": "plate", "type": "rectangle" }
      ]

spec:
  description: YOLOv8 plate detection using ultralytics packages
  runtime: 'python:3.11'
  handler: main:handler
  eventTimeout: 30s
  build:
    image: cvat.pth.yolov8
    baseImage: ultralytics/ultralytics:latest

    directives:
      preCopy:
        - kind: USER
          value: root
        - kind: RUN
          value: apt update && apt install --no-install-recommends -y libglib2.0-0
        - kind: RUN
          value: pip install ultralytics
        - kind: WORKDIR
          value: /opt/nuclio

  triggers:
    myHttpTrigger:
      numWorkers: 1
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432 # 32MB

  resources:
    limits:
      nvidia.com/gpu: 1

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
